<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F1F4F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ourie" />
    <title>Ourie</title>
    <script>
      // iOS Safari's "Add to Home Screen" seems to read the icon-label/icon
      // from the document's initial state rather than tracking later DOM
      // updates (unlike the icon href, which it re-fetches fresh at add-time).
      // AppMetaSync caches the logged-in couple's nickname/icon here after it
      // loads them, so on the *next* visit we can set them synchronously
      // before this script tag's siblings are even parsed -- must stay in
      // sync with the 'ourie-app-meta' key written in src/app/AppMetaSync.tsx.
      //
      // Only apple-mobile-web-app-title is touched, not document.title / the
      // page <title> -- those drive the browser tab and Share Sheet preview,
      // which should stay branded as "Ourie" rather than showing the
      // couple's nickname.
      (function () {
        try {
          var raw = localStorage.getItem('ourie-app-meta');
          if (!raw) return;
          var meta = JSON.parse(raw);
          if (meta.title) {
            var titleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (titleMeta) titleMeta.setAttribute('content', meta.title);
          }
          if (meta.icon) {
            var iconLink = document.querySelector('link[rel="apple-touch-icon"]');
            if (iconLink) iconLink.setAttribute('href', meta.icon);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
